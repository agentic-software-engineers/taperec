name: Lint commits
on:
  # lint again when the title changes, since a squash merge lands the title on main
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions:
  contents: read

jobs:
  commitlint:
    runs-on: ubuntu-latest
    steps:
      # check out history so the pull request's commit range resolves
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      # provide the Node runtime the linter needs
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.23.5

      # install the commit-message linter and its ruleset at the versions the lockfile pins
      - run: npm ci --prefix .github/tools --ignore-scripts --no-audit --no-fund

      # lint the commits this pull request adds, and those alone, with the rules kept beside the linter
      - run: >
          .github/tools/node_modules/.bin/commitlint --config .github/tools/commitlint.json --verbose
          --from ${{ github.event.pull_request.base.sha }}
          --to ${{ github.event.pull_request.head.sha }}

      # lint the pull request's title, which a squash merge lands on main and release-please reads
      - name: Lint the title
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: printf '%s\n' "${TITLE}" | .github/tools/node_modules/.bin/commitlint --config .github/tools/commitlint.json --verbose
