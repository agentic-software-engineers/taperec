name: Audit workflows
on:
  pull_request:
  push:
    branches:
      - main

permissions: {}

jobs:
  zizmor:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # check out the workflows the audit reads
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # audit every workflow with the zizmor version the action pins by hash, and fail on a finding
      - uses: zizmorcore/zizmor-action@a818f16177a5395fc11d3c73577caabaa7119391 # v0.9.1
        with:
          advanced-security: false
          annotations: true
