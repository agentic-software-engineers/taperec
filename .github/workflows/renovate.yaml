name: Update dependencies

# Opens and merges the dependency pull requests, hourly and on demand.
on:
  schedule:
    # Every hour, so each run merges a passing update and the next ones follow within hours.
    - cron: "0 * * * *"
  workflow_dispatch:
    inputs:
      logLevel:
        description: "Log level"
        default: "info"
        type: choice
        options: [debug, info, warn]

# One run at a time, so each pull request opens once.
concurrency:
  group: renovate
  cancel-in-progress: false

jobs:
  renovate:
    runs-on: ubuntu-latest
    # The app token carries the rights, so the built-in token stays empty.
    permissions: {}
    steps:
      # Act as the renovate app, so its pull requests start the checks.
      - name: App token
        id: app-token
        # Pinned to a commit: a tag can move, a commit stays fixed.
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          client-id: ${{ vars.RENOVATE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RENOVATE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
          # The dependency dashboard is an issue, and labels go through the same API.
          permission-issues: write
          # Lets renovate update a pinned action in .github/workflows.
          permission-workflows: write
          # Dependabot alerts, which renovate reads to recognise a security update.
          permission-vulnerability-alerts: read
          # Renovate reads the state of a branch, and writes a status of its own
          # that says whether the release age is met.
          permission-statuses: write
          permission-checks: read

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The job leaves the built-in token empty, so checkout needs the app token.
          token: ${{ steps.app-token.outputs.token }}
          persist-credentials: false

      # Run renovate against this repository alone, at the version pinned here.
      - name: Renovate
        uses: renovatebot/github-action@ebcbb513d07ead4d9c0c2139064301db05e84a3e # v46.3.15
        with:
          token: ${{ steps.app-token.outputs.token }}
          renovate-version: 44.264.1
        env:
          LOG_LEVEL: ${{ inputs.logLevel || 'info' }}
          RENOVATE_PLATFORM: github
          RENOVATE_AUTODISCOVER: "false"
          RENOVATE_REPOSITORIES: ${{ github.repository }}
